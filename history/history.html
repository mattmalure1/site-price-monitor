<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price History</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <img src="../icons/icon48.png" alt="Logo" class="logo">
        <div>
          <h1 id="item-name">Price History</h1>
          <p class="subtitle" id="item-url"></p>
        </div>
      </div>
      <div class="header-actions">
        <a id="btn-visit" class="btn-primary btn-small" href="#" target="_blank">Visit Page</a>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Current</span>
        <span class="stat-value" id="stat-current">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Target</span>
        <span class="stat-value" id="stat-target">--</span>
      </div>
      <div class="stat-card stat-low">
        <span class="stat-label">All-Time Low</span>
        <span class="stat-value" id="stat-low">--</span>
        <span class="stat-date" id="stat-low-date"></span>
      </div>
      <div class="stat-card stat-high">
        <span class="stat-label">All-Time High</span>
        <span class="stat-value" id="stat-high">--</span>
        <span class="stat-date" id="stat-high-date"></span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Average</span>
        <span class="stat-value" id="stat-avg">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Data Points</span>
        <span class="stat-value" id="stat-count">0</span>
      </div>
    </div>

    <!-- Chart -->
    <div class="chart-section">
      <div class="chart-header">
        <h2>Price Chart</h2>
        <div class="chart-range">
          <button class="range-btn active" data-range="all">All</button>
          <button class="range-btn" data-range="30d">30d</button>
          <button class="range-btn" data-range="7d">7d</button>
          <button class="range-btn" data-range="24h">24h</button>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="price-chart"></canvas>
      </div>
    </div>

    <!-- History Table -->
    <div class="table-section">
      <h2>Price Log</h2>
      <div class="table-wrapper">
        <table id="history-table">
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Price</th>
              <th>Change</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="history.js" type="module"></script>
</body>
</html>
